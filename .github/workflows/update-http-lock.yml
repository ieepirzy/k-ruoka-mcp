name: update-http-lock

on:
  push:
    branches:
      - mira/multistore-http

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: mira/multistore-http
          persist-credentials: true
      - name: Resolve HTTP transport dependencies
        run: cargo check
      - name: Commit lockfile if Cargo changed it
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Update lockfile for HTTP transport"
          git push origin HEAD:mira/multistore-http

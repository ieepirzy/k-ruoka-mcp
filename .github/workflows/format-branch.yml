name: format-branch

on:
  push:
    branches:
      - mira/multistore-http

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: mira/multistore-http
          persist-credentials: true
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf
        with:
          tool: tombi
      - name: Apply canonical formatters
        run: |
          cargo fmt --all
          tombi format
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml src
          git commit -m "Apply canonical formatting"
          git push origin HEAD:mira/multistore-http

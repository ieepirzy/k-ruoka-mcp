name: lockfile-oracle

on:
  pull_request:

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve new feature dependencies without refreshing the graph
        run: cargo check

      - name: Commit Cargo.lock if Cargo changed it
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already matches Cargo.toml'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'Update Cargo.lock for catalogue HTTP client'
          git push origin HEAD:"${HEAD_REF}"
